name: PhotoAnchor checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -c requirements-social.lock '.[social,test]'
      - run: python -m pytest -q -m 'not network and not regtest and not social'
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: photoanchor-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
