name: Consolidation protocol gate

on:
  push:
    branches: ['integration/**', main]
  pull_request:

jobs:
  protocol-and-settlement:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install setuptools wheel -c requirements-social.lock '.[social,test]'
      # The legacy aiohttp application's socket-based tests have a separate
      # migration gate. They are not part of the offline protocol suite.
      - run: python -m pytest -q --ignore=tests/test_web_server.py -m 'not network and not regtest'
      - name: Build and inspect installed distribution outside source checkout
        shell: bash
        run: |
          python -m pip wheel --no-deps --no-build-isolation . --wheel-dir "$RUNNER_TEMP/wheels"
          python -m pip install --no-deps --target "$RUNNER_TEMP/installed" "$RUNNER_TEMP"/wheels/*.whl
          cd "$RUNNER_TEMP"
          export PYTHONPATH="$RUNNER_TEMP/installed"
          python - <<'PY'
          import os
          from pathlib import Path
          import settlement, upp_protocol, social
          root = Path(os.environ['PYTHONPATH']).resolve()
          for module in (settlement, upp_protocol, social):
              assert Path(module.__file__).resolve().is_relative_to(root)
          from upp_protocol import build_payload
          print('Installed settlement and protocol imports passed')
          PY
          python -m settlement --help
          "$RUNNER_TEMP/installed/bin/photoanchor-bundle" --help
