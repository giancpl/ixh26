name: Local Docker integrations
on: workflow_dispatch
jobs:
  regtest-and-social:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/regtest-demo.sh
      - run: scripts/social-demo.sh
      - run: scripts/social-compose.sh run --rm social-tests
      - run: scripts/social-compose.sh run --rm crypto-tests
      - run: scripts/server-regtest-demo.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-demo-evidence
          path: social-artifacts/
      - run: scripts/social-compose.sh logs --no-color
        if: failure()
