[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upp-settlement"
version = "0.1.0"
description = "Opaque-payload Bitcoin timestamp settlement using OpenTimestamps"
requires-python = ">=3.11"
dependencies = ["opentimestamps-client==0.8.0", "opentimestamps==0.5.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
protocol = ["nostr-sdk==0.45.1"]

[project.scripts]
upp-settlement = "settlement.cli:main"
photoanchor-bundle = "upp_protocol.verify_bundle:main"

[tool.setuptools.packages.find]
include = ["settlement*", "upp_protocol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: opt-in real calendar submission", "regtest: opt-in real local Docker integration"]
