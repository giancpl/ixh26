[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upp-settlement"
version = "0.1.0"
description = "Opaque-payload Bitcoin timestamp settlement using OpenTimestamps"
requires-python = ">=3.11"
dependencies = ["opentimestamps-client==0.8.0", "opentimestamps==0.5.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "cryptography>=46.0.7,<47", "pqcrypto==0.4.0"]
fingerprinto = ["cryptography>=46.0.7,<47"]
hybrid = ["cryptography>=46.0.7,<47", "pqcrypto==0.4.0"]
prnu = ["cryptography>=46.0.7,<47", "pillow==13.0.0"]
protocol = ["nostr-sdk==0.45.1"]
server = ["aiohttp==3.14.5", "pillow==13.0.0"]
social = ["cryptography>=46.0.7,<47", "nostr-sdk==0.45.1", "fastapi==0.115.12", "uvicorn==0.34.2", "httpx==0.28.1", "pillow==13.0.0"]

[project.scripts]
upp-settlement = "settlement.cli:main"
photoanchor-bundle = "upp_protocol.verify_bundle:main"
fingerprinto = "fingerprinto.cli:main"

[tool.setuptools.packages.find]
include = ["settlement*", "upp_protocol*", "social*", "server*", "fingerprinto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: opt-in real calendar submission", "regtest: opt-in real local Docker integration", "social: opt-in real local social integration", "local_http: local HTTP sockets only; external connections remain forbidden"]
