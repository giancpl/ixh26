[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upp-settlement"
version = "0.1.0"
description = "Opaque-payload Bitcoin timestamp settlement using OpenTimestamps"
requires-python = ">=3.11"
dependencies = ["opentimestamps-client==0.8.0", "opentimestamps==0.5.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "cryptography>=46.0.7,<47", "pqcrypto==0.4.0"]
fingerprinto = ["cryptography>=46.0.7,<47"]
hybrid = ["cryptography>=46.0.7,<47", "pqcrypto==0.4.0"]
prnu = ["cryptography>=46.0.7,<47", "Pillow==13.0.0"]

[project.scripts]
upp-settlement = "settlement.cli:main"
fingerprinto = "fingerprinto.cli:main"

[tool.setuptools.packages.find]
include = ["settlement*", "fingerprinto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: opt-in real calendar submission", "regtest: opt-in real local Docker integration"]
